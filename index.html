
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Signal WhatsApp</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }
    main {
      max-width: 500px;
      margin: auto;
      padding: 24px;
      background: #1b2733;
      border-radius: 18px;
    }
    h1 { color: #55df91; text-align: center; }
    p { color: #d1d9e0; line-height: 1.5; }
    label { display: block; margin-top: 18px; }
    input, select, textarea {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #536272;
      background: #101820;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #25d366;
      color: #102018;
      font-size: 16px;
      font-weight: bold;
    }
    .notice { font-size: 13px; }
    /* Photo de profil */
main > img {
  width: 130px;
  height: 130px;
  object-fit: cover;
  border-radius: 50%;
  border: 4px solid #25d366;
  box-shadow: 0 0 20px #25d366;
  display: block;
  margin: 0 auto 25px;
  animation: glow 3s ease-in-out infinite;
}

/* Animation lumineuse */
@keyframes glow {
  0%, 100% {
    box-shadow: 0 0 10px #25d366;
  }
  50% {
    box-shadow: 0 0 30px #25d366;
  }
}

/* Titre */
h1 {
  text-align: center;
  color: #25d366;
  text-shadow: 0 0 8px #25d36655;
}

/* Amélioration mobile */
@media (max-width: 600px) {
  main {
    width: 100%;
  }

  h1 {
    font-size: clamp(22px, 6vw, 32px);
  }

  input, select, textarea, button {
    max-width: 100%;
  }
  }
    /* DESIGN PREMIUM NOIR & BLANC */

body {
  background:
    radial-gradient(circle at 20% 10%, #333 0%, transparent 35%),
    radial-gradient(circle at 90% 80%, #222 0%, transparent 40%),
    #080808;
  color: #f5f5f5;
  min-height: 100vh;
  font-family: Arial, sans-serif;
}

main {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 24px;
  padding: 28px 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  backdrop-filter: blur(16px);
  animation: apparition 0.8s ease;
}

@keyframes apparition {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

main > img {
  border: 4px solid white !important;
  box-shadow: 0 0 25px rgba(255,255,255,0.6) !important;
  transition: transform 0.3s;
}

main > img:hover {
  transform: scale(1.08);
}

h1 {
  color: white !important;
  font-weight: 900;
  letter-spacing: 1px;
  text-shadow: 0 0 18px rgba(255,255,255,0.35);
}

input, select, textarea {
  background: #151515 !important;
  color: white !important;
  border: 1px solid #555 !important;
  border-radius: 12px !important;
  padding: 14px !important;
  box-sizing: border-box;
  width: 100%;
  transition: 0.3s;
}

input:focus, select:focus, textarea:focus {
  border-color: white !important;
  outline: none;
  box-shadow: 0 0 12px rgba(255,255,255,0.2);
}

button {
  background: linear-gradient(135deg, #fff, #aaa) !important;
  color: black !important;
  border: none !important;
  border-radius: 14px !important;
  padding: 15px !important;
  font-weight: bold;
  transition: 0.3s;
}

button:active {
  transform: scale(0.97);
}

@media (prefers-reduced-motion: reduce) {
  main, main > img {
    animation: none !important;
    transition: none !important;
  }
}
    /* 🔥 BLACK & GOLD PREMIUM */

body {
  background: #050505;
  color: #f5e6b3;
  min-height: 100vh;
}

main {
  background: linear-gradient(145deg, #141414, #080808);
  border: 1px solid #b89745;
  border-radius: 22px;
  padding: 25px 18px;
  box-shadow: 0 0 25px rgba(212,175,55,0.2);
}

/* PHOTO DE PROFIL */
main > img {
  width: 135px;
  height: 135px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #ffd700 !important;
  box-shadow: 0 0 25px #ffd70099 !important;
  animation: goldGlow 3s infinite alternate;
}

@keyframes goldGlow {
  from { box-shadow: 0 0 10px #ffd700; }
  to { box-shadow: 0 0 35px #ffd700; }
}

/* TITRE */
h1 {
  color: #ffd700 !important;
  text-align: center;
  text-shadow: 0 0 15px #ffd70077;
}

/* CHAMPS */
input, select, textarea {
  background: #0b0b0b !important;
  color: #fff !important;
  border: 1px solid #b89745 !important;
  border-radius: 12px !important;
  padding: 15px !important;
  width: 100%;
}

input:focus, select:focus, textarea:focus {
  border-color: #ffd700 !important;
  outline: none;
  box-shadow: 0 0 12px #ffd70055;
}

/* BOUTON PRINCIPAL */
button {
  background: linear-gradient(135deg, #ff2020, #a90000) !important;
  color: white !important;
  border: none !important;
  border-radius: 12px !important;
  padding: 16px !important;
  font-weight: bold;
  box-shadow: 0 0 18px #ff000066;
  transition: transform 0.2s;
}

button:active {
  transform: scale(0.96);
}

/* LIENS */
a {
  color: #25d366;
  font-weight: bold;
  text-decoration: none;
}

a:hover {
  text-shadow: 0 0 10px #25d366;
}

@media (prefers-reduced-motion: reduce) {
  main > img {
    animation: none;
  }
}
  </style>
</head>
<body>
<main>
  <img src="IMG-20260901-WA0342.jpg" alt="Profil" width="120" style="border-radius:50%;display:block;margin:0 auto 20px;">
  <h1>🛡️ Signal WhatsApp</h1>
  <p>Prépare un signalement concernant un numéro suspect.</p>

  <form id="reportForm">
    <label for="phone">Numéro WhatsApp concerné</label>
    <input id="phone" type="tel" placeholder="+225..." required>

    <label for="reason">Motif du signalement</label>
    <select id="reason" required>
      <option value="">Choisir un motif</option>
      <option>Spam</option>
      <option>Arnaque présumée</option>
      <option>Menaces ou harcèlement</option>
      <option>Autre</option>
    </select>

    <label for="details">Détails (sans informations privées)</label>
    <textarea id="details" rows="4" maxlength="1000"
      placeholder="Explique brièvement ce qui s'est passé..."></textarea>

    <button type="submit">Préparer mon signalement</button>
  </form>

  <p id="result" role="status"></p>
  <p class="notice">
    Ce site ne transmet pas automatiquement de signalement à WhatsApp.
    Une accusation n'est pas une preuve. Vérifie les faits avant d'agir.
    N'inscris aucun mot de passe ni code de vérification.
  </p>
  <p><a style="color:#55df91"
    href="https://www.whatsapp.com/contact/" target="_blank"
    rel="noopener">Contacter WhatsApp</a></p>
</main>

<script>
document.getElementById("reportForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const phone = document.getElementById("phone").value.trim();
  const reason = document.getElementById("reason").value;
  const details = document.getElementById("details").value.trim();

  const message =
    "Objet : Signalement d'un numéro WhatsApp\n\n" +
    "Numéro concerné : " + phone + "\n" +
    "Motif déclaré : " + reason + "\n" +
    "Détails : " + (details || "Non précisés") + "\n\n" +
    "Merci de vérifier les faits.";

  const result = document.getElementById("result");
  result.textContent = message;

  const copyButton = document.createElement("button");
  copyButton.type = "button";
  copyButton.textContent = "Copier le texte";
  copyButton.onclick = async function() {
    try {
      await navigator.clipboard.writeText(message);
      result.textContent = "Texte copié ! Tu peux le transmettre à l'assistance.";
    } catch {
      result.textContent = message + "\nSélectionne et copie ce texte manuellement.";
    }
  };
  result.appendChild(document.createElement("br"));
  result.appendChild(copyButton);
});
</script>
</body>
</html>
